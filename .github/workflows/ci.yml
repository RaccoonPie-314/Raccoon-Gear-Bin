name: ci

on:
  push:
    # Branch pushes only. Naming `branches` also excludes tags, which matters
    # here: `backup/*` checkpoint tags are pushed alongside almost every commit
    # (docs/rules/GIT_CONVENTIONS.md), and an unfiltered `on: push` started a
    # second full pipeline for a SHA that had already been checked.
    # No `pull_request` trigger: work lands by pushing to `main`, so a PR check
    # would run the same commit a second time in its own concurrency group.
    branches: ['**']

# A newer push to the same ref cancels its queued/running predecessors, so a
# rapid burst of commits costs one pipeline instead of N. The group must be
# per-ref: a whole-workflow group would let a push to one branch cancel
# another branch's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint is independent of the bundle, so it runs beside build+verify instead
  # of in front of it. Fails only on new hard errors — the pre-existing debt is
  # documented in eslint.config.mjs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ~/.bun/install/cache is Bun's content-addressed download cache. Measured
      # here it is roughly break-even — a cold `bun install` is 7 s, restoring the
      # 201 MB cache is 6 s — so it stays as insurance for a larger tree, not as a
      # speed win. `bun install --frozen-lockfile` remains the gate that
      # package.json and bun.lock agree.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  # `bun run verify` serves the `.output` that `bun run build` produces, so the
  # two stay in one job. No build cache: it measured ~1 MB against a 26 s build,
  # which is noise next to verify's ~6 min — and it was the one step here that
  # could have served a stale Vite/Nuxt entry. The wall clock lives in the
  # harness' fixed waits, not in anything CI can cache.
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # scripts/verify-ui.mjs runs on Node and needs Node 24 for global
      # `WebSocket`; it has no dependencies of its own.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify UI
        run: bun run verify
        env:
          # The harness' built-in candidates are macOS/Windows paths, so point
          # it at the runner's stock Chrome.
          CHROME_PATH: /usr/bin/google-chrome
